apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: frontend-svc-pod-delete
  namespace: hce
spec:
  arguments:
    parameters:
    - name: adminModeNamespace
      value: hce
  entrypoint: frontend-svc-pod-delete
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsGroup: 0
    runAsNonRoot: true
    runAsUser: 1000
  serviceAccountName: argo-chaos
  templates:
  - inputs: {}
    metadata: {}
    name: frontend-svc-pod-delete
    outputs: {}
    steps:
    - - arguments: {}
        name: pod-delete-nrk
        template: pod-delete-nrk
    - - arguments: {}
        name: cleanup-chaos-resources
        template: cleanup-chaos-resources
  - container:
      args:
      - kubectl delete chaosengine -l workflow_run_id={{workflow.uid}} -n {{workflow.parameters.adminModeNamespace}}
      command:
      - sh
      - -c
      image: docker.io/harness/chaos-go-runner:1.47.0
      name: ""
      resources: {}
    inputs: {}
    metadata: {}
    name: cleanup-chaos-resources
    outputs: {}
  - container:
      args:
      - -file=/tmp/chaosengine-pod-delete-nrk.yaml
      - -saveName=/tmp/engine-name
      command:
      - ./chaos-checker
      image: docker.io/harness/chaos-go-runner:1.47.0
      name: ""
      resources: {}
    inputs:
      artifacts:
      - name: pod-delete-nrk
        path: /tmp/chaosengine-pod-delete-nrk.yaml
        raw:
          data: |
            apiVersion: litmuschaos.io/v1alpha1
            kind: ChaosEngine
            metadata:
              namespace: "{{workflow.parameters.adminModeNamespace}}"
              labels:
                name: pod-delete
                app.kubernetes.io/part-of: litmus
                app.kubernetes.io/component: experiment-job
                app.kubernetes.io/version: ci
                workflow_run_id: "{{ workflow.uid }}"
                workflow_name: frontend-svc-pod-delete
              annotations:
                probeRef: '[{"probeID":"kubernetes-system-probe","mode":"Edge"},{"probeID":"boutique-app-availability-check","mode":"Continuous"},{"probeID":"frontend-latency-check","mode":"OnChaos"},{"probeID":"cart-availability-check","mode":"Continuous"},{"probeID":"cartservice-latency-check","mode":"OnChaos"},{"probeID":"cart-functionality-check","mode":"OnChaos"}]'
              generateName: pod-delete-nrk
            spec:
              appinfo:
                appns: boutique
                applabel: app=frontend
                appkind: deployment
              engineState: active
              terminationGracePeriodSeconds: 30
              chaosServiceAccount: litmus-admin
              experiments:
                - name: pod-delete
                  image: docker.io/harness/chaos-go-runner:1.47.0
                  imagePullPolicy: Always
                  args:
                    - -c
                    - ./experiments -name pod-delete
                  command:
                    - /bin/bash
                  spec:
                    components:
                      env:
                        - name: TOTAL_CHAOS_DURATION
                          value: "60"
                        - name: RAMP_TIME
                          value: ""
                        - name: FORCE
                          value: "false"
                        - name: CHAOS_INTERVAL
                          value: "60"
                        - name: PODS_AFFECTED_PERC
                          value: ""
                        - name: TARGET_CONTAINER
                          value: ""
                        - name: TARGET_PODS
                          value: ""
                        - name: DEFAULT_HEALTH_CHECK
                          value: "false"
                        - name: NODE_LABEL
                          value: ""
                        - name: SEQUENCE
                          value: parallel
                      securityContext:
                        podSecurityContext:
                          runAsUser: 2000
                          runAsGroup: 0
              components:
                runner: {}
                sidecar:
                  - image: docker.io/harness/chaos-log-watcher:1.47.0
                    imagePullPolicy: Always
              jobCleanUpPolicy: delete
    metadata:
      labels:
        weight: "10"
    name: pod-delete-nrk
    outputs: {}
